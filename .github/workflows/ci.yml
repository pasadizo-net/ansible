name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: ansible-lint

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - name: Install the collection from this checkout
        run: |
          ansible-galaxy collection build --output-path /tmp/build
          ansible-galaxy collection install /tmp/build/*.tar.gz
      - name: First run
        run: ansible-playbook -i localhost, -c local tests/playbook.yml
      - name: Second run changes nothing
        run: |
          ansible-playbook -i localhost, -c local tests/playbook.yml | tee /tmp/second.log
          grep -E 'localhost +: ok=[0-9]+ +changed=0 ' /tmp/second.log
      - if: failure()
        run: sudo journalctl -u pasadizo --no-pager | tail -100

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible-core
      - run: ansible-galaxy collection build --output-path dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
