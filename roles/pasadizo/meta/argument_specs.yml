---
argument_specs:
  main:
    short_description: Install and run Pasadizo.
    options:
      pasadizo_version:
        type: str
        description: Release to install, without the leading "v".
      pasadizo_release_base_url:
        type: str
        description: Base URL of the releases; the tag and the file name are appended.
      pasadizo_download_on_controller:
        type: bool
        description: Download the archive on the controller and copy it to the host.
      pasadizo_download_dir:
        type: path
        description: Where the archive is downloaded.
      pasadizo_install_dir:
        type: path
        description: Directory that keeps every installed version.
      pasadizo_binary:
        type: path
        description: Symlink to the current version.
      pasadizo_user:
        type: str
        description: System user the service runs as.
      pasadizo_group:
        type: str
        description: System group the service runs as.
      pasadizo_config_dir:
        type: path
        description: Configuration directory.
      pasadizo_config_file:
        type: path
        description: Configuration file.
      pasadizo_config:
        type: dict
        required: true
        description: The configuration, written as JSON and checked with `pasadizo check`.
      pasadizo_config_diff:
        type: bool
        description: Show the configuration diff in --diff mode. Turn it off when the configuration holds secrets that must not reach a terminal or a CI log.
      pasadizo_service_name:
        type: str
        description: Name of the systemd service.
      pasadizo_service_enabled:
        type: bool
        description: Start the service at boot.
      pasadizo_service_state:
        type: str
        choices: [started, stopped, restarted]
        description: State of the service. "stopped" installs and validates without binding a port.
      pasadizo_restart_on_change:
        type: bool
        description: Restart the service when the binary, the configuration or the unit changes.
      pasadizo_capabilities:
        type: list
        elements: str
        description: Linux capabilities the service keeps.
      pasadizo_limit_nofile:
        type: int
        description: LimitNOFILE of the service.
      pasadizo_service_extra:
        type: str
        description: Extra lines for the [Service] section.
      pasadizo_tcp_tuning:
        type: bool
        description: Set BBR, fq and no slow start after idle on the host (sysctl.d and modules-load.d).
      pasadizo_tcp_congestion_control:
        type: str
        description: TCP congestion control for the host.
      pasadizo_tcp_default_qdisc:
        type: str
        description: Default queueing discipline for the host.
      pasadizo_sysctl_extra:
        type: dict
        description: More sysctls written to the same file.
      pasadizo_watchdog_enabled:
        type: bool
        description: Install the end-to-end watchdog.
      pasadizo_watchdog_proxies:
        type: list
        elements: str
        description: Proxy URLs to probe, e.g. http://127.0.0.1:8080.
      pasadizo_watchdog_urls:
        type: list
        elements: str
        description: URLs fetched through each proxy; any 2xx or 3xx answer passes.
      pasadizo_watchdog_interval:
        type: str
        description: systemd time span between runs.
      pasadizo_watchdog_retries:
        type: int
        description: Failed rounds before a restart.
      pasadizo_watchdog_retry_interval:
        type: int
        description: Seconds between rounds.
      pasadizo_watchdog_timeout:
        type: int
        description: Seconds for one fetch.
      pasadizo_watchdog_cooldown:
        type: int
        description: Seconds after a start during which the watchdog does not restart again.
