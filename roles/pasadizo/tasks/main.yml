---
- name: Check the role variables
  ansible.builtin.assert:
    that:
      - pasadizo_config is mapping
      - pasadizo_config | length > 0
      - pasadizo_service_state in ['started', 'stopped', 'restarted']
      - not pasadizo_watchdog_enabled or pasadizo_watchdog_proxies | length > 0
    fail_msg: >-
      pasadizo_config must be a non-empty mapping, pasadizo_service_state one of
      started, stopped or restarted, and pasadizo_watchdog_proxies non-empty when
      the watchdog is enabled.
    quiet: true
  tags: [pasadizo, pasadizo-install, pasadizo-config]

- name: Tune the kernel TCP stack
  ansible.builtin.import_tasks: tuning.yml
  when: pasadizo_tcp_tuning
  tags: [pasadizo, pasadizo-tuning]

- name: Install the binary
  ansible.builtin.import_tasks: install.yml
  tags: [pasadizo, pasadizo-install]

- name: Write the configuration
  ansible.builtin.import_tasks: config.yml
  tags: [pasadizo, pasadizo-config]

- name: Install and run the service
  ansible.builtin.import_tasks: service.yml
  tags: [pasadizo, pasadizo-install, pasadizo-config]

- name: Install the watchdog
  ansible.builtin.import_tasks: watchdog.yml
  tags: [pasadizo, pasadizo-watchdog]
