---
- name: Install the systemd unit
  ansible.builtin.template:
    src: pasadizo.service.j2
    dest: "/etc/systemd/system/{{ pasadizo_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart pasadizo

- name: Set the service state
  ansible.builtin.systemd_service:
    name: "{{ pasadizo_service_name }}"
    daemon_reload: true
    enabled: "{{ pasadizo_service_enabled }}"
    state: "{{ pasadizo_service_state }}"
