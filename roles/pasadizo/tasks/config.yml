---
- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ pasadizo_config_dir }}"
    state: directory
    owner: root
    group: "{{ pasadizo_group }}"
    mode: "0750"

# `pasadizo check` runs against the new file before it replaces the old one, so
# a configuration the binary rejects never reaches the service.
- name: Write the configuration
  ansible.builtin.copy:
    content: "{{ pasadizo_config | to_nice_json(indent=2) }}\n"
    dest: "{{ pasadizo_config_file }}"
    owner: root
    group: "{{ pasadizo_group }}"
    mode: "0640"
    validate: "{{ pasadizo_binary }} check -c %s"
  diff: "{{ pasadizo_config_diff }}"
  notify: Restart pasadizo
