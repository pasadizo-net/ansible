---
# Release to install, without the leading "v".
pasadizo_version: "1.15.0-alpha.14-pasadizo.3"
pasadizo_release_base_url: "https://github.com/pasadizo-net/pasadizo/releases/download"

# The archive is downloaded on the controller and copied to the host, so a host
# that cannot reach GitHub (a filtered network) still installs. Set to false to
# download on the host instead.
pasadizo_download_on_controller: true
pasadizo_download_dir: /var/tmp/pasadizo-ansible

# Every version stays in pasadizo_install_dir as pasadizo-<version>, and
# pasadizo_binary is a symlink to the current one, so a rollback is a symlink
# change and a restart.
pasadizo_install_dir: /usr/local/lib/pasadizo
pasadizo_binary: /usr/local/bin/pasadizo

pasadizo_user: pasadizo
pasadizo_group: pasadizo
pasadizo_config_dir: /etc/pasadizo
pasadizo_config_file: "{{ pasadizo_config_dir }}/config.json"

# The configuration, as data. It is written as JSON and checked with
# `pasadizo check` before it replaces the file on the host.
pasadizo_config: {}
# Show the configuration diff in --diff mode. Turn it off when the
# configuration holds secrets that must not reach a terminal or a CI log.
pasadizo_config_diff: true

# systemd service.
pasadizo_service_name: pasadizo
pasadizo_service_enabled: true
# started, stopped or restarted. "stopped" installs and validates everything
# without taking any port, for a staged cutover.
pasadizo_service_state: started
# Restart the service when the binary, the configuration or the unit changes.
pasadizo_restart_on_change: true
# Linux capabilities the service keeps, e.g. CAP_NET_BIND_SERVICE for ports
# below 1024, CAP_NET_ADMIN and CAP_NET_RAW for tun or auto_redirect.
pasadizo_capabilities: []
pasadizo_limit_nofile: 1048576
# Extra lines for the [Service] section.
pasadizo_service_extra: ""

# Kernel TCP tuning for a proxy on long, lossy paths: BBR congestion control
# with fq pacing, and no slow start after an idle period, so a tunnel that
# carried no traffic for a moment does not restart at a small congestion window.
# Opt-in, because it changes the whole host, not only Pasadizo.
pasadizo_tcp_tuning: false
pasadizo_tcp_congestion_control: bbr
pasadizo_tcp_default_qdisc: fq
# More sysctls for the same file, e.g. {"net.ipv4.tcp_rmem": "4096 131072 16777216"}.
pasadizo_sysctl_extra: {}

# Watchdog: every pasadizo_watchdog_interval, fetch the URLs through each proxy
# and restart the service when a proxy fails every retry, at most once per
# cooldown (seconds). It catches a process that accepts connections but cannot
# carry them, which a TCP check or a systemd restart policy does not.
pasadizo_watchdog_enabled: false
pasadizo_watchdog_proxies: []
#   - http://127.0.0.1:8080
pasadizo_watchdog_urls:
  - https://www.google.com/generate_204
  - https://cp.cloudflare.com/generate_204
pasadizo_watchdog_interval: 2min
pasadizo_watchdog_retries: 5
pasadizo_watchdog_retry_interval: 20
pasadizo_watchdog_timeout: 10
pasadizo_watchdog_cooldown: 600
